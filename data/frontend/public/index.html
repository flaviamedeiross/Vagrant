<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Site de Receitas</title>
  <style>
    body { font-family: Arial; margin: 20px; background: #fafafa; }
    h1 { color: #333; }
    .card { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 8px; background: #fff; }
  </style>
</head>
<body>
  <h1>Bem-vindo ao Site de Receitas!</h1>
  <div id="receitas"></div>

  <script>
    fetch('/api/receitas')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('receitas');
        data.forEach(r => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<h2>${r.nome}</h2>
                            <p><strong>Descrição:</strong> ${r.descricao}</p>
                            <p><strong>Ingredientes:</strong> ${r.ingredientes}</p>
                            <p><strong>Preparo:</strong> ${r.preparo}</p>`;
          container.appendChild(card);
        });
      })
      .catch(() => document.getElementById('receitas').innerHTML = '<p>Erro ao carregar receitas.</p>');
  </script>
</body>
</html>
